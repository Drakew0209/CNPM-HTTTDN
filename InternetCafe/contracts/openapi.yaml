    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
      example: c-001
    Search:
      name: search
      in: query
      description: Case-insensitive substring across JSON-visible row values; empty means all.
      schema:
        type: string
    Status:
      name: status
      in: query
      description: Exact row status; unsupported values return an empty list.
      schema:
        type: string
    Sort:
      name: sort
      in: query
      description: Top-level field; numeric or Vietnamese locale string sort. Unknown field leaves equivalent values
        in existing order.
      schema:
        type: string
        pattern: ^[a-zA-Z][a-zA-Z0-9]*$
    Order:
      name: order
      in: query
      schema:
        type: string
        enum:
          - asc
          - desc
        default: asc
    Page:
      name: page
      in: query
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 1000000
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 100
        default: 20
    From:
      name: from
      in: query
      schema:
        type: string
        format: date
        example: 2026-10-03
      description: Inclusive Asia/Ho_Chi_Minh date lower bound. from must be <= to.
    To:
      name: to
      in: query
      schema:
        type: string
        format: date
        example: 2026-10-03
      description: "Inclusive Asia/Ho_Chi_Minh date upper bound. List timestamp priority: createdAt, date,
        startDate, checkIn, startTime, joinedAt, month day 01; rows without dates are excluded."
