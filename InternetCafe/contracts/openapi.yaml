              description: HTTP server date used to estimate client clock offset. Exposed through CORS in HTTP mock host.
              schema:
                type: string
              example: Sat, 03 Oct 2026 05:00:00 GMT
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Computer"
                  meta:
