openapi: 3.0.3
info:
  title: InternetCafe shared frontend mock contract
  version: 1.0.0
  description: Proposed FE contract, implemented by mock/engine.ts and shared loopback mock/server.ts. NOT a
    production backend. JSON camelCase; {data,meta?}/{error}; integer VND; UTC timestamps; calendar filtering
    in Asia/Ho_Chi_Minh. No passwords/hash in responses. All endpoints below /api/v1. GET /health at server
    root is HTTP-host diagnostics only. OPTIONS is CORS transport, not a business operation. OpenAPI generated
    by contracts/generate-openapi.ts; edit generator then regenerate.
servers:
  - url: http://127.0.0.1:5055/api/v1
    description: Shared web/WPF in-memory demo host; reset on restart
  - url: /api/v1
    description: Browser MSW engine, isolated from HTTP-host state
security:
  - BearerAuth: []
tags:
  - name: computers
  - name: customers
  - name: products
  - name: categories
  - name: orders
  - name: topups
  - name: transactions
  - name: suppliers
  - name: inventory
  - name: feedback
  - name: surveys
  - name: employees
  - name: shifts
  - name: schedules
  - name: leaves
  - name: attendance
  - name: payroll
  - name: accounts
  - name: sessions
  - name: auth
  - name: me
  - name: workspace
  - name: reports
x-demo-permissions:
  readByRole:
    Admin:
      - accounts
      - products
      - categories
      - suppliers
    Owner:
      - computers
      - customers
      - products
      - categories
      - orders
      - topups
      - transactions
      - suppliers
      - inventory
      - feedback
      - surveys
      - employees
      - shifts
      - schedules
      - leaves
      - attendance
      - payroll
      - sessions
    Manager:
      - computers
      - customers
      - products
      - categories
      - orders
      - topups
      - transactions
      - suppliers
      - inventory
      - feedback
      - surveys
      - employees
      - shifts
      - schedules
      - leaves
      - attendance
      - payroll
      - sessions
    Cashier:
      - computers
      - customers
      - products
      - categories
      - orders
      - topups
      - transactions
      - sessions
    Staff:
      - employees
      - shifts
      - schedules
      - leaves
      - attendance
      - payroll
    Customer:
      - computers
      - customers
      - products
      - categories
      - orders
      - topups
      - transactions
      - feedback
      - surveys
      - sessions
  management:
    - Owner
    - Manager
  operators:
    - Owner
    - Manager
    - Cashier
  customerScope: Own customer and dependent rows; targeted surveys only.
  staffScope: Own employeeId HR rows and all shift definitions.
  permissionStrings:
    - <resource>:read
    - management:write (Owner/Manager)
    - operations:write (Owner/Manager/Cashier)
    - reports:read (Owner/Manager/Cashier)
    - accounts:write (Admin)
  note: Auth permission strings support UI navigation; server additionally checks action role, ownership, field
    whitelist and state transitions. Staff in prose is not the Staff role for operator commands.
